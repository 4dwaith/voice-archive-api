name: voice-archive

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${VOICE_ARCHIVE_POSTGRES_USER:?Set VOICE_ARCHIVE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${VOICE_ARCHIVE_POSTGRES_PASSWORD:?Set VOICE_ARCHIVE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${VOICE_ARCHIVE_POSTGRES_DB:?Set VOICE_ARCHIVE_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${VOICE_ARCHIVE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      target: runtime
    environment:
      VOICE_ARCHIVE_POSTGRES_USER: ${VOICE_ARCHIVE_POSTGRES_USER:?Set VOICE_ARCHIVE_POSTGRES_USER in .env}
      VOICE_ARCHIVE_POSTGRES_PASSWORD: ${VOICE_ARCHIVE_POSTGRES_PASSWORD:?Set VOICE_ARCHIVE_POSTGRES_PASSWORD in .env}
      VOICE_ARCHIVE_POSTGRES_DB: ${VOICE_ARCHIVE_POSTGRES_DB:?Set VOICE_ARCHIVE_POSTGRES_DB in .env}
      VOICE_ARCHIVE_POSTGRES_HOST: db
      VOICE_ARCHIVE_POSTGRES_PORT: 5432
      VOICE_ARCHIVE_ENVIRONMENT: ${VOICE_ARCHIVE_ENVIRONMENT:-development}
      VOICE_ARCHIVE_CORS_ORIGINS: ${VOICE_ARCHIVE_CORS_ORIGINS:?Set VOICE_ARCHIVE_CORS_ORIGINS in .env}
      VOICE_ARCHIVE_UPLOAD_MAX_BYTES: ${VOICE_ARCHIVE_UPLOAD_MAX_BYTES:-null}
      VOICE_ARCHIVE_COVER_MAX_BYTES: ${VOICE_ARCHIVE_COVER_MAX_BYTES:-26214400}
      VOICE_ARCHIVE_PDF_MAX_BYTES: ${VOICE_ARCHIVE_PDF_MAX_BYTES:-1500000000}
      VOICE_ARCHIVE_UPLOAD_ROOT: /app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-test:
    image: postgres:18-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: ${VOICE_ARCHIVE_TEST_POSTGRES_USER:?Set VOICE_ARCHIVE_TEST_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${VOICE_ARCHIVE_TEST_POSTGRES_PASSWORD:?Set VOICE_ARCHIVE_TEST_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voice_archive_test
    ports:
      - "127.0.0.1:${VOICE_ARCHIVE_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      VOICE_ARCHIVE_ENVIRONMENT: test
      VOICE_ARCHIVE_POSTGRES_USER: ${VOICE_ARCHIVE_TEST_POSTGRES_USER:?Set VOICE_ARCHIVE_TEST_POSTGRES_USER in .env}
      VOICE_ARCHIVE_POSTGRES_PASSWORD: ${VOICE_ARCHIVE_TEST_POSTGRES_PASSWORD:?Set VOICE_ARCHIVE_TEST_POSTGRES_PASSWORD in .env}
      VOICE_ARCHIVE_POSTGRES_DB: voice_archive_test
      VOICE_ARCHIVE_POSTGRES_HOST: db-test
      VOICE_ARCHIVE_POSTGRES_PORT: 5432
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres-data:
