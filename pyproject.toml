[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voice-archive-api"
version = "0.1.0"
description = "Backend API for Voice Archive"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "apscheduler>=3.11,<4",
    "asgi-correlation-id>=4.3,<5",
    "fastapi>=0.119,<1",
    "langcodes>=3.5,<4",
    "pillow>=12,<14",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.11,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_archive_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["voice_archive_api"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

