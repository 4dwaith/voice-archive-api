[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voice-archive-api"
version = "0.1.0"
description = "Backend API for Voice Archive"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "fastapi>=0.119,<1",
    "pydantic-settings>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_archive_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["voice_archive_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true

