[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voice-archive-api"
version = "0.1.0"
description = "Backend API for Voice Archive"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "apscheduler>=3.11,<4",
    "asgi-correlation-id>=4.3,<5",
    "fastapi>=0.119,<1",
    "google-genai>=2.34,<3",
    "html5lib>=1.1,<2",
    "httpx>=0.28,<1",
    "langcodes>=3.5,<4",
    "mutagen>=1.47,<2",
    "pgvector>=0.5.1,<0.6",
    "pillow>=12,<14",
    "psycopg[binary]>=3.3,<4",
    "protobuf>=5,<8",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.11,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "sentencepiece>=0.2.1,<0.3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.37,<1",
    "pwdlib[argon2]>=0.3,<1",
    "email-validator>=2,<3",
    "pyjwt>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "pytest-bdd>=8.1,<9",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_archive_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["voice_archive_api"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mutagen.*"]
ignore_missing_imports = true

[project.scripts]
manage-users = "voice_archive_api.cli.users:main"
import-book-content = "voice_archive_api.cli.content_import:main"
summarize-book = "voice_archive_api.cli.summaries:main"
build-book-windows = "voice_archive_api.cli.windows:main"
submit-book-embeddings = "voice_archive_api.cli.embeddings:main"

